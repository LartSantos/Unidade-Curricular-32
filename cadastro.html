<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="container">
        <h1>Sistema de Biblioteca</h1>

        <nav>
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('cadastro') }}">Cadastrar Livro</a>
            <a href="{{ url_for('acervo') }}">Acervo</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="card">

        <h2>Cadastrar Livro</h2>

        <form action="{{ url_for('cadastrar_livro') }}" method="POST">

            <div class="campo">
                <label for="titulo">Título do livro:</label>

                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    placeholder="Digite o título"
                    required
                >
            </div>

            <div class="campo">
                <label for="ano_publicacao">Ano de publicação:</label>

                <input
                    type="number"
                    id="ano_publicacao"
                    name="ano_publicacao"
                    placeholder="Ex.: 2020"
                >
            </div>

            <div class="campo">
                <label for="id_autor">Autor:</label>

                <select id="id_autor" name="id_autor" required>

                    <option value="">
                        Selecione um autor
                    </option>

                    {% for autor in autores %}
                        <option value="{{ autor['id'] }}">
                            {{ autor['nome'] }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <div class="campo">
                <label for="id_categoria">Categoria:</label>

                <select id="id_categoria" name="id_categoria" required>

                    <option value="">
                        Selecione uma categoria
                    </option>

                    {% for categoria in categorias %}
                        <option value="{{ categoria['id'] }}">
                            {{ categoria['nome'] }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <div class="botoes-formulario">

                <button type="submit" class="botao">
                    Cadastrar Livro
                </button>

                <a
                    href="{{ url_for('acervo') }}"
                    class="botao botao-cancelar"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </section>

</main>

<footer>
    <p>Sistema de Biblioteca</p>
</footer>

</body>
</html>
